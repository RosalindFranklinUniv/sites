<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="300">
  <title>Task Status Public</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --bg:#000000;
      --card:#000000;
      --border:#101010;
      --text:#b6c2b6;
      --muted:#7a847a;
      --accent:#1a3a66;
      --shadow:0 14px 34px rgba(0,0,0,0.18);
      --alert-bg:#120909;
      --alert-border:#2a1a1a;
      --alert-accent:#c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;
      font-family: "IBM Plex Mono", "Courier New", "Lucida Console", monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 24px;
      display:flex;
      justify-content:center;
      padding: 0px 10px;
      min-height: 100vh;
      touch-action: pan-y;
    }
    main { width: min(980px, 100%); }
    .status-card {
      background: var(--card);
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .status-card.attention {
      background: var(--card);
      border: none;
    }
    .status-header {
      display:flex;
      align-items:center;
      gap:10px;
      color: var(--text);
      margin-bottom: 6px;
      font-size: 32px;
      line-height: 1.3;
    }
    .status-lines {
      display:flex;
      flex-direction:column;
      gap:1px;
      line-height: 1.15;
    }
    .status-line { color: var(--text); }
    .status-line.time-line { display:flex; flex-direction:column; gap:1px; font-size: 120px; line-height: 1.05; font-weight: 700; }
    .status-line.time-line .time-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .status-line.time-line .time-row.fresh { color: var(--accent); }
    .status-line.time-line .time-row.stale { color: var(--alert-accent); }
    .muted { color: var(--muted); }
    .updated-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display:inline-block;
      box-shadow: 0 0 8px var(--border);
      flex-shrink: 0;
    }
    .updated-dot.fresh {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .updated-dot.stale {
      background: var(--alert-accent);
      box-shadow: 0 0 8px rgba(192,57,43,0.9);
    }
    @media (max-width: 640px) {
      body { padding: 14px 10px; }
      .status-card { padding: 12px; }
      .status-header { font-size: 36px; }
      .status-lines { font-size: 32px; }
    }
  </style>
</head>
<body>
      <main>
    <section class="status-card" data-overall-ok="true">
      <div class="status-lines">
        
        <div class="status-line muted time-line"><span id="last-updated" data-updated-iso="2026-09-17T12:00:07.997097" style="display:none;">09/17 12:00:07</span><span class="time-row fresh"><span id="current-time">12:00</span></span></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const el = document.getElementById("current-time");
      const updatedEl = document.getElementById("last-updated");
      const sectionEl = document.querySelector("[data-overall-ok]");
      const overallOk = sectionEl ? sectionEl.getAttribute("data-overall-ok") === "true" : true;
      const updatedIso = updatedEl ? updatedEl.getAttribute("data-updated-iso") : null;
      const updatedDate = updatedIso ? new Date(updatedIso) : null;
      if (!el) return;
      const formatTime = (d) => {
        const pad = (n) => String(n).padStart(2, "0");
        let hours = d.getHours() % 12;
        hours = hours === 0 ? 12 : hours;
        const minutes = pad(d.getMinutes());
        return `${hours}:${minutes}`;
      };
      const tick = () => {
        const now = new Date();
        el.textContent = formatTime(now);
        const diffMs = updatedDate && !isNaN(updatedDate.getTime()) ? Math.abs(now - updatedDate) : 0;
        const isStale = !overallOk || diffMs > 71 * 60 * 1000;
        const timeRows = document.querySelectorAll(".time-row");
        timeRows.forEach((row) => {
          row.classList.toggle("fresh", !isStale);
          row.classList.toggle("stale", isStale);
        });
      };
      tick();
      setInterval(tick, 1000);
    })();
    (() => {
      let startY = null;
      let pulling = false;
      const THRESHOLD = 60; // pixels pulled down from the top

      window.addEventListener("touchstart", (e) => {
        if (window.scrollY === 0) {
          startY = e.touches[0].clientY;
          pulling = true;
        } else {
          pulling = false;
        }
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (!pulling || startY === null) return;
        const delta = e.touches[0].clientY - startY;
        if (delta > THRESHOLD) {
          pulling = false;
          location.reload();
        }
      }, { passive: true });

      window.addEventListener("touchend", () => {
        startY = null;
        pulling = false;
      });
    })();
  </script>
</body>
</html>
